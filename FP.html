<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyPay — Финансовый дом для всей семьи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #0b3d36;
  --dark2: #115e54;
  --dark3: #0a2e29;
  --gold: #c9a961;
  --gold-light: #e8d5a3;
  --gold-deep: #a8873f;
  --bg: #eef2f1;
  --card: #ffffff;
  --text: #16211f;
  --muted: #6d817c;
  --green: #1f9d63;
  --green-soft: #e3f5ec;
  --red: #d9534f;
  --red-soft: #fdecea;
  --blue: #4a7ec9;
  --purple: #8a6bc9;
  --orange: #e08a3c;
  --line: #eef1f0;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 20px 50px -18px rgba(11, 61, 54, .45);
  --shadow-card: 0 6px 22px -10px rgba(11, 61, 54, .18);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, #d9e8e3 0%, transparent 55%),
    radial-gradient(900px 500px at 110% 110%, #e9e2cf 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
  -webkit-font-smoothing: antialiased;
}

.app {
  width: 100%;
  max-width: 440px;
  height: min(900px, calc(100vh - 36px));
  background: var(--bg);
  border-radius: 38px;
  box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,.6) inset;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
}

/* ===================== Шапка ===================== */
header {
  background:
    radial-gradient(420px 220px at 90% -30%, rgba(201,169,97,.35), transparent 60%),
    linear-gradient(150deg, var(--dark3), var(--dark) 45%, var(--dark2));
  color: #fff;
  padding: 20px 20px 22px;
  border-radius: 0 0 30px 30px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
header::after {
  content: "";
  position: absolute;
  inset: auto -40px -80px auto;
  width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(232,213,163,.18), transparent 70%);
  pointer-events: none;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 10px;
}
.logo {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span { color: var(--gold-light); }
.logo-mark {
  width: 30px; height: 30px;
  border-radius: 10px;
  background: linear-gradient(140deg, var(--gold), var(--gold-deep));
  display: grid; place-items: center;
  font-size: 15px;
  box-shadow: 0 4px 12px -4px rgba(201,169,97,.8);
}
.user-select {
  appearance: none;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.22);
  color: #fff;
  border-radius: 12px;
  padding: 8px 30px 8px 12px;
  font-size: 12.5px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  transition: background .2s, border-color .2s;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23e8d5a3' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 11px center;
  backdrop-filter: blur(6px);
}
.user-select:hover { background-color: rgba(255,255,255,.16); }
.user-select option { color: var(--text); }

.balance-block { position: relative; z-index: 1; }
.balance-label {
  font-size: 12px;
  letter-spacing: .4px;
  text-transform: uppercase;
  opacity: .65;
  font-weight: 600;
}
.balance-value {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.5px;
  margin-top: 2px;
  display: flex;
  align-items: baseline;
  gap: 6px;
  line-height: 1.1;
}
.balance-value small { font-size: 17px; font-weight: 600; opacity: .7; }

/* ===================== Маскот ===================== */
.mascot-wrap {
  position: absolute;
  right: 14px;
  bottom: 6px;
  width: 84px;
  height: 84px;
  z-index: 2;
  cursor: pointer;
  filter: drop-shadow(0 8px 16px rgba(0,0,0,.3));
  transition: transform .25s ease;
}
.mascot-wrap:hover { transform: scale(1.06) rotate(-3deg); }
.mascot { width: 100%; height: 100%; overflow: visible; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-3px) scale(1.02)} }
.mascot .tail { transform-origin: 20px 62px; animation: tail 2.4s ease-in-out infinite; }
@keyframes tail { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(10deg)} }
.mascot .eye-pupil { animation: look 5s ease-in-out infinite; }
@keyframes look { 0%,40%,100%{transform:translateX(0)} 50%,60%{transform:translateX(1.6px)} 70%{transform:translateX(-1.4px)} }
.mascot .eyelid { transform-origin: center; animation: blink 4.6s infinite; }
@keyframes blink { 0%,92%,100%{transform:scaleY(0)} 95%{transform:scaleY(1)} }
.mascot .ear-l { transform-origin: 30px 20px; animation: earL 3.6s ease-in-out infinite; }
.mascot .ear-r { transform-origin: 62px 20px; animation: earR 4.1s ease-in-out infinite; }
@keyframes earL { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-6deg)} }
@keyframes earR { 0%,100%{transform:rotate(0)} 50%{transform:rotate(6deg)} }
.mascot-wrap.happy .mascot { animation: hop .45s ease; }
@keyframes hop { 0%{transform:translateY(0) scale(1)} 35%{transform:translateY(-10px) scale(1.06)} 70%{transform:translateY(0) scale(.98)} 100%{transform:translateY(0) scale(1)} }
.mascot-wrap.sad .mascot { animation: shake .4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px) rotate(-2deg)} 75%{transform:translateX(4px) rotate(2deg)} }

/* ===================== Контент ===================== */
main {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: #cfd8d5 transparent;
}
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: #cfd8d5; border-radius: 4px; }

.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 17px;
  box-shadow: var(--shadow-card);
  border: 1px solid rgba(255,255,255,.7);
  animation: cardIn .35s ease both;
}
@keyframes cardIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

.card h3 {
  font-size: 14.5px;
  font-weight: 700;
  margin-bottom: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  letter-spacing: -.1px;
}
.card h3 .tag {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--gold-deep);
  background: #fdf6e7;
  padding: 4px 9px;
  border-radius: 20px;
  letter-spacing: .2px;
}

/* ===================== KPI-плитки ===================== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.kpi {
  background: linear-gradient(160deg, #fff, #f6f8f7);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 11px 10px;
  text-align: left;
  position: relative;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -14px rgba(11,61,54,.4); }
.kpi .kpi-ico { font-size: 17px; margin-bottom: 5px; display: block; }
.kpi .kpi-val { font-size: 14px; font-weight: 800; color: var(--dark); letter-spacing: -.3px; }
.kpi .kpi-lbl { font-size: 9.5px; color: var(--muted); margin-top: 1px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.kpi .kpi-trend { font-size: 10px; font-weight: 700; margin-top: 3px; }
.kpi .kpi-trend.up { color: var(--green); }
.kpi .kpi-trend.down { color: var(--red); }

/* ===================== Диаграммы ===================== */
.chart-wrap { display: flex; flex-direction: column; gap: 10px; }
.donut-block { display: flex; align-items: center; gap: 14px; }
.donut-svg { flex-shrink: 0; }
.donut-seg {
  cursor: pointer;
  transition: opacity .25s, transform .25s, filter .25s;
  transform-origin: 60px 60px;
}
.donut-seg:hover { transform: scale(1.06); filter: brightness(1.1); }
.donut-seg.dim { opacity: .25; }
.donut-center-value { font-size: 15px; font-weight: 800; fill: var(--dark); }
.donut-center-label { font-size: 8px; fill: var(--muted); font-weight: 600; letter-spacing: .3px; }

.legend { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.legend-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; cursor: pointer;
  padding: 3px 5px; border-radius: 7px;
  transition: background .2s;
}
.legend-item:hover { background: #f4f7f6; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.legend-item .lname { flex: 1; color: var(--text); font-weight: 500; }
.legend-item .lval { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend-item.dim { opacity: .4; }

/* Столбчатая диаграмма */
.bars {
  display: flex; align-items: flex-end; justify-content: space-between;
  height: 130px; gap: 8px; padding-top: 8px;
}
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar-track { width: 100%; height: 100%; display: flex; align-items: flex-end; }
.bar {
  width: 100%;
  border-radius: 8px 8px 5px 5px;
  background: linear-gradient(180deg, var(--gold-light), var(--gold-deep));
  transition: height .8s cubic-bezier(.22,1,.36,1), filter .2s;
  position: relative;
  min-height: 4px;
  cursor: pointer;
}
.bar:hover { filter: brightness(1.12); }
.bar.green { background: linear-gradient(180deg, #4fce95, var(--green)); }
.bar.blue { background: linear-gradient(180deg, #7ba6e0, var(--blue)); }
.bar.purple { background: linear-gradient(180deg, #b39ae0, var(--purple)); }
.bar-label { font-size: 9.5px; color: var(--muted); font-weight: 600; }
.bar-tip {
  position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -4px) scale(.9);
  background: var(--dark3); color: #fff; font-size: 9.5px; font-weight: 600;
  padding: 3px 7px; border-radius: 6px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: all .2s; z-index: 5;
}
.bar:hover .bar-tip { opacity: 1; transform: translate(-50%, -6px) scale(1); }

/* Линейный график */
.line-chart { width: 100%; height: 110px; }
.line-path {
  fill: none; stroke: var(--green); stroke-width: 2.5;
  stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 400; stroke-dashoffset: 400;
  animation: draw 1.4s ease forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.line-area { fill: url(#areaGrad); opacity: 0; animation: fadeIn .8s .6s ease forwards; }
@keyframes fadeIn { to { opacity: 1; } }
.line-dot { fill: #fff; stroke: var(--green); stroke-width: 2.5; cursor: pointer; transition: r .2s; }
.line-dot:hover { r: 5.5; }

/* Радар */
.radar { width: 100%; height: 190px; }
.radar-poly { fill: rgba(201,169,97,.25); stroke: var(--gold-deep); stroke-width: 2; }
.radar-poly.alt { fill: rgba(31,157,99,.2); stroke: var(--green); }
.radar-axis { stroke: #e2e8e6; stroke-width: 1; }
.radar-label { font-size: 9px; fill: var(--muted); font-weight: 600; }

/* Тепловая карта */
.heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.heat-cell {
  aspect-ratio: 1; border-radius: 5px; background: #eef1f0;
  transition: transform .2s, filter .2s; cursor: pointer; position: relative;
}
.heat-cell:hover { transform: scale(1.15); filter: brightness(1.1); z-index: 2; }
.heat-cell[data-l="1"] { background: #d4e9de; }
.heat-cell[data-l="2"] { background: #a6d6bd; }
.heat-cell[data-l="3"] { background: #5fbe8f; }
.heat-cell[data-l="4"] { background: var(--green); }
.heat-cell[data-l="5"] { background: var(--dark2); }
.heat-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 8px; font-size: 9.5px; color: var(--muted); }
.heat-legend .heat-cell { width: 12px; height: 12px; aspect-ratio: auto; }

/* Спарклайн в целях */
.spark { width: 42px; height: 18px; }
.spark path { fill: none; stroke: var(--gold-deep); stroke-width: 1.8; stroke-linecap: round; }
.spark.green path { stroke: var(--green); }

/* Кольцо XP */
.xp-ring-wrap { display: flex; align-items: center; gap: 14px; }
.xp-ring { width: 78px; height: 78px; flex-shrink: 0; }
.xp-ring circle { fill: none; stroke-width: 7; }
.xp-ring .track { stroke: #eef1f0; }
.xp-ring .val { stroke: url(#xpGrad); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); }
.xp-ring text { font-family: inherit; }

/* Цели */
.goal { margin-bottom: 13px; }
.goal:last-child { margin-bottom: 0; }
.goal-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12.5px; margin-bottom: 6px; gap: 8px;
}
.goal-row .gname { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.goal-row .gval { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11.5px; }
.progress { height: 8px; background: #eef1f0; border-radius: 6px; overflow: hidden; }
.progress > div {
  height: 100%; border-radius: 6px;
  background: linear-gradient(90deg, var(--gold-deep), var(--gold-light));
  transition: width .8s cubic-bezier(.22,1,.36,1); width: 0;
}
.progress.green > div { background: linear-gradient(90deg, var(--green), #4fce95); }

/* Карманные */
.pocket {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 10px;
}
.pocket:last-child { border: none; }
.pocket .amount { font-weight: 700; color: var(--dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pocket .amount.low { color: var(--red); }
.pocket b { font-weight: 600; }
.mini-ring { width: 32px; height: 32px; flex-shrink: 0; }
.mini-ring circle { fill: none; stroke-width: 3.5; }
.mini-ring .mt { stroke: #eef1f0; }
.mini-ring .mv { stroke: var(--gold-deep); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.mini-ring .mv.ok { stroke: var(--green); }
.mini-ring .mv.low { stroke: var(--red); }
.pocket-info { flex: 1; }

/* Кнопки */
.btn {
  border: none; border-radius: var(--radius-sm); padding: 12px 16px;
  font-size: 13.5px; font-weight: 600; font-family: inherit; cursor: pointer;
  transition: transform .12s ease, opacity .2s, box-shadow .2s; letter-spacing: -.1px;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--dark), var(--dark2)); color: #fff; width: 100%; box-shadow: 0 8px 18px -8px rgba(11,61,54,.6); }
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: var(--dark3); width: 100%; box-shadow: 0 8px 18px -8px rgba(201,169,97,.7); }
.btn-ghost { width: 100%; background: #f2f5f4; color: var(--text); margin-top: 8px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; width: auto; }

/* Быстрые действия */
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 11px 4px; border-radius: 14px; background: #f6f8f7;
  border: 1px solid var(--line); cursor: pointer; transition: all .2s;
  font-size: 9.5px; font-weight: 600; color: var(--text); text-align: center;
}
.qa:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 8px 16px -12px rgba(11,61,54,.4); }
.qa .qa-ico {
  width: 34px; height: 34px; border-radius: 11px;
  display: grid; place-items: center; font-size: 16px;
  background: linear-gradient(140deg, var(--gold-light), var(--gold));
  color: var(--dark3);
}
.qa:nth-child(2) .qa-ico { background: linear-gradient(140deg, #b8d9f0, var(--blue)); color: #fff; }
.qa:nth-child(3) .qa-ico { background: linear-gradient(140deg, #b5e8cf, var(--green)); color: #fff; }
.qa:nth-child(4) .qa-ico { background: linear-gradient(140deg, #d5c3f0, var(--purple)); color: #fff; }

/* Безопасность */
.safe-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12.5px;
}
.safe-item:last-child { border: none; }
.safe-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; }
.safe-icon.ok { background: var(--green-soft); }
.safe-icon.warn { background: #fdf0e5; }
.safe-item b { display: block; font-size: 12.5px; font-weight: 600; }
.safe-item p { color: var(--muted); font-size: 11.5px; margin-top: 2px; line-height: 1.4; }

/* Квесты */
.quest {
  display: flex; justify-content: space-between; align-items: center;
  background: #fdf6e7; border-radius: 13px; padding: 12px 13px;
  margin-bottom: 9px; font-size: 12.5px; gap: 8px; transition: background .3s;
}
.quest:last-child { margin-bottom: 0; }
.quest.done { background: var(--green-soft); }
.quest.done span:first-child { text-decoration: line-through; opacity: .7; }
.quest .xp { color: var(--gold-deep); font-weight: 700; font-size: 11.5px; white-space: nowrap; }

/* Навигация */
nav {
  flex-shrink: 0; display: flex; justify-content: space-around; align-items: center;
  background: var(--dark3); padding: 9px 6px calc(12px + env(safe-area-inset-bottom, 0));
  border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px -16px rgba(0,0,0,.5);
}
nav button {
  background: none; border: none; color: rgba(255,255,255,.5);
  font-size: 10.5px; font-weight: 600; font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; transition: color .2s, transform .2s;
  padding: 5px 10px; border-radius: 12px; position: relative;
}
nav button .ico { font-size: 19px; transition: transform .25s; }
nav button.active { color: var(--gold-light); }
nav button.active .ico { transform: translateY(-2px) scale(1.1); }
nav button.active::after {
  content: ""; position: absolute; bottom: 1px;
  width: 18px; height: 3px; border-radius: 3px; background: var(--gold-light);
}

/* Модалка */
.modal-overlay {
  position: absolute; inset: 0; background: rgba(10, 46, 41, .55);
  backdrop-filter: blur(4px); display: none; justify-content: center;
  align-items: flex-end; z-index: 50;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; width: 100%; border-radius: 28px 28px 0 0;
  padding: 22px 20px calc(26px + env(safe-area-inset-bottom, 0));
  animation: slideUp .28s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp { from{transform:translateY(70px);opacity:0} to{transform:none;opacity:1} }
.modal h2 { font-size: 18px; margin-bottom: 16px; color: var(--dark3); font-weight: 800; letter-spacing: -.3px; }
.modal label {
  font-size: 12px; font-weight: 600; color: var(--muted); display: block;
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: .3px;
}
.modal input, .modal select {
  width: 100%; padding: 13px 14px; border: 1.5px solid #e2e8e6;
  border-radius: 13px; font-size: 14px; font-family: inherit;
  margin-bottom: 15px; outline: none; transition: border-color .2s, box-shadow .2s;
  background: #fbfcfc; color: var(--text);
}
.modal input:focus, .modal select:focus {
  border-color: var(--gold); box-shadow: 0 0 0 4px rgba(201,169,97,.15); background: #fff;
}
.modal .btn { margin-top: 4px; }

/* Toast */
.toast {
  position: absolute; bottom: 92px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--dark3); color: #fff; padding: 12px 20px;
  border-radius: 14px; font-size: 12.5px; font-weight: 500;
  opacity: 0; pointer-events: none;
  transition: all .35s cubic-bezier(.22,1,.36,1);
  z-index: 60; max-width: 88%; text-align: center;
  box-shadow: 0 14px 30px -12px rgba(0,0,0,.6); line-height: 1.35;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }
.muted-line { font-size: 11.5px; color: var(--muted); margin-top: 9px; line-height: 1.4; }
.stat-big { font-size: 28px; font-weight: 800; color: var(--dark); letter-spacing: -.8px; margin-bottom: 3px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
.rating-row { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 13px; align-items: center; }
.rating-row:last-child { border: none; }
.rating-bar { flex: 1; margin: 0 10px; height: 5px; background: #eef1f0; border-radius: 4px; overflow: hidden; }
.rating-bar > div { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold-light)); border-radius: 4px; }

@media (max-width: 480px) {
  body { padding: 0; }
  .app { max-width: 100%; height: 100vh; border-radius: 0; }
  header { border-radius: 0 0 28px 28px; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <header>
    <div class="header-top">
      <div class="logo">
        <span class="logo-mark">🦊</span>

    <div class="balance-block">

      <div class="balance-value">

    <div class="mascot-wrap" id="mascot" onclick="mascotSay()" title="Фин — ваш финансовый помощник">

        <path class="ear-r" d="M70 24 L 73 10 L 61 18 Z" fill="#f3d3a8" opacity=".9"/>
        <ellipse cx="50" cy="40" rx="25" ry="23" fill="#e8964a"/>
        <ellipse cx="50" cy="46" rx="17" ry="15" fill="#fbe9cf"/>
        <g>

        </g>

        <path d="M50 50 C 47.5 53.5, 44 53.5, 42.5 51.5" stroke="#3a241a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M50 50 C 52.5 53.5, 56 53.5, 57.5 51.5" stroke="#3a241a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <circle cx="38" cy="30" r="2" fill="#fff" opacity=".35"/>

  <main id="mainContent"></main>

<script>
/* ==================== СОСТОЯНИЕ ==================== */
const state = {
  currentRole: 'parent',
  currentTab: 'home',
  familyBudget: 184500,
  roles: {

    teen:   { name: 'Миша', title: 'Подросток 16 лет', balance: 8500, canManage: false },
    child:  { name: 'Соня', title: 'Ребёнок 9 лет', balance: 1200, canManage: false },
    senior: { name: 'Бабушка', title: 'Пожилой родственник', balance: 42000, canManage: false }
  },
  goals: [
    { name: '🏖️ Отпуск на море', current: 62000, target: 120000, history: [30, 38, 44, 50, 55, 62] },
    { name: '🚗 Новый автомобиль', current: 145000, target: 800000, history: [90, 105, 118, 128, 138, 145] },
    { name: '🎓 Образование детей', current: 38000, target: 200000, history: [18, 22, 27, 31, 35, 38] }
  ],
  expenses: [
    { n: 'Коммуналка', v: 12000, c: '#0b3d36', ico: '🏠' },
    { n: 'Школа и кружки', v: 18000, c: '#c9a961', ico: '🏫' },
    { n: 'Продукты', v: 32000, c: '#1f9d63', ico: '🍽️' },
    { n: 'Развлечения', v: 6500, c: '#4a7ec9', ico: '🎮' },
    { n: 'Накопления', v: 25000, c: '#8a6bc9', ico: '💰' }
  ],
  monthly: [
    { m: 'Янв', v: 48000, c: 'gold' }, { m: 'Фев', v: 52000, c: 'gold' },
    { m: 'Мар', v: 61000, c: 'green' }, { m: 'Апр', v: 45000, c: 'gold' },
    { m: 'Май', v: 68000, c: 'blue' }, { m: 'Июн', v: 74000, c: 'green' }
  ],
  pockets: [
    { name: 'Миша', limit: 5000, spent: 3200 },
    { name: 'Соня', limit: 1500, spent: 900 },
    { name: 'Бабушка', limit: 15000, spent: 4200 }
  ],

  xpMax: 500,

    { n: 'Бюджет', a: 75, b: 55 },
    { n: 'Накопления', a: 62, b: 48 },
    { n: 'Инвестиции', a: 40, b: 30 },
    { n: 'Долги', a: 80, b: 65 },
    { n: 'Планирование', a: 58, b: 42 },
    { n: 'Защита', a: 70, b: 60 }
  ],
  heatmap: [1,2,0,3,2,4,1, 2,3,1,4,5,2,0, 1,0,2,3,1,4,2, 3,2,4,1,2,0,3, 2,1,0,3,4,2,1, 0,2,1,5,3,2,4, 1,3,2,0,1,2,3],
  securityEvents: [
    { icon: '✅', type: 'ok', title: 'Подозрительный перевод заблокирован', desc: 'Попытка перевода 15 000 ₽ на неизвестный счёт — отклонено ИИ-детектором' },
    { icon: '👨‍👩‍👧', type: 'ok', title: 'Доверенные контакты активны', desc: '3 члена семьи подтверждают крупные операции' },
    { icon: '⚠️', type: 'warn', title: 'Лимит для Сони приближается', desc: 'Израсходовано 900 из 1 500 ₽ карманных' }
  ]
};

/* ==================== МАСКОТ ==================== */
const mascotLines = [
  'Привет! Я Фин — ваш финансовый помощник 🦊',
  'Совет: отложите 10% от дохода сразу после зарплаты.',
  'Нажмите на сегмент диаграммы — увидите детали 👆',
  'Крупные переводы проверяет ИИ-детектор. Всё под контролем!',
  'Выполняйте квесты — и получите звание «Финансовый гуру»!'
];
let mascotIdx = 0;
function mascotSay() {
  showToast(mascotLines[mascotIdx % mascotLines.length]);
  mascotIdx++;
  mascotReaction('happy');
}
function mascotReaction(type) {
  const m = document.getElementById('mascot');
  m.classList.remove('happy', 'sad');
  void m.offsetWidth;
  m.classList.add(type);
  setTimeout(() => m.classList.remove(type), 600);
}

/* ==================== РЕНДЕР ==================== */
function render() {
  const r = state.roles[state.currentRole];
  document.getElementById('balanceValue').textContent = r.balance.toLocaleString('ru-RU');
  document.getElementById('balanceLabel').textContent =
    state.currentRole === 'parent'
      ? 'Общий семейный бюджет'
      : `Баланс: ${r.name} · ${r.title}`;

  const main = document.getElementById('mainContent');
  main.innerHTML = tabs[state.currentTab]();

  requestAnimationFrame(() => {
    document.querySelectorAll('.progress > div[data-w]').forEach(el => {
      el.style.width = Math.min(100, el.dataset.w) + '%';
    });
    document.querySelectorAll('.bar[data-h]').forEach(el => {
      el.style.height = el.dataset.h + '%';
    });
    document.querySelectorAll('.mini-ring .mv[data-off]').forEach(el => {
      el.style.strokeDashoffset = el.dataset.off;
    });
    const xpVal = document.querySelector('.xp-ring .val[data-off]');
    if (xpVal) xpVal.style.strokeDashoffset = xpVal.dataset.off;
  });
}

function r_canManage() { return state.roles[state.currentRole].canManage; }

/* ==================== SVG-ХЕЛПЕРЫ ==================== */
function donutChart(items, size = 120, thickness = 18) {
  const total = items.reduce((s, i) => s + i.v, 0);
  const r = (size - thickness) / 2;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const segs = items.map((it, idx) => {
    const frac = it.v / total;
    const dash = frac * circ;
    const seg = `
      <circle class="donut-seg" data-idx="${idx}"
        cx="${cx}" cy="${cy}" r="${r}"
        fill="none" stroke="${it.c}" stroke-width="${thickness}"
        stroke-dasharray="${dash} ${circ - dash}"
        stroke-dashoffset="${-offset}"
        transform="rotate(-90 ${cx} ${cy})"
        onmouseenter="highlightDonut(${idx})"
        onmouseleave="resetDonut()"
        onclick="showToast('${it.n}: ${it.v.toLocaleString('ru-RU')} ₽ — ${Math.round(frac*100)}%')"/>`;
    offset += dash;
    return seg;
  }).join('');
  return `
    <svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f0f3f2" stroke-width="${thickness}"/>
      ${segs}
      <text x="${cx}" y="${cy - 2}" text-anchor="middle" class="donut-center-value">${total.toLocaleString('ru-RU')}</text>
      <text x="${cx}" y="${cy + 10}" text-anchor="middle" class="donut-center-label">₽ / мес</text>
    </svg>`;
}

function miniRing(pct, size = 32) {
  const r = (size - 7) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  const cls = pct < 30 ? 'low' : pct < 70 ? '' : 'ok';
  return `
    <svg class="mini-ring" viewBox="0 0 ${size} ${size}">
      <circle class="mt" cx="${size/2}" cy="${size/2}" r="${r}"/>
      <circle class="mv ${cls}" cx="${size/2}" cy="${size/2}" r="${r}"
        stroke-dasharray="${c}" stroke-dashoffset="${c}"
        data-off="${off}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>`;
}

function sparkline(data, w = 42, h = 18, green = false) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * (w - 2) + 1;
    const y = h - 1 - ((v - min) / range) * (h - 4);
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="spark ${green ? 'green' : ''}" viewBox="0 0 ${w} ${h}"><path d="${d}"/></svg>`;
}

/* ==================== ЭКРАНЫ ==================== */
const tabs = {
  home: () => {
    const totalExp = state.expenses.reduce((s, e) => s + e.v, 0);
    const saved = state.familyBudget - totalExp;
    return `
    <div class="kpi-grid">
      <div class="kpi">
        <span class="kpi-ico">📈</span>
        <div class="kpi-val">${(saved/1000).toFixed(1)}k ₽</div>
        <div class="kpi-lbl">Свободно</div>
        <div class="kpi-trend up">▲ 12%</div>
      </div>
      <div class="kpi">
        <span class="kpi-ico">🎯</span>
        <div class="kpi-val">${state.goals.length}</div>
        <div class="kpi-lbl">Цели</div>
        <div class="kpi-trend up">▲ 2 новые</div>
      </div>
      <div class="kpi">
        <span class="kpi-ico">🔥</span>
        <div class="kpi-val">${state.xp} XP</div>
        <div class="kpi-lbl">Уровень</div>
        <div class="kpi-trend up">▲ 50 XP</div>
      </div>
    </div>

    <div class="card">
      <h3>📊 Куда уходят деньги <span class="tag">${totalExp.toLocaleString('ru-RU')} ₽</span></h3>
      <div class="donut-block">
        ${donutChart(state.expenses, 124, 18)}
        <div class="legend">
          ${state.expenses.map((e, i) => `
            <div class="legend-item" data-idx="${i}"
              onmouseenter="highlightDonut(${i})" onmouseleave="resetDonut()"
              onclick="showToast('${e.n}: ${e.v.toLocaleString('ru-RU')} ₽')">
              <span class="legend-dot" style="background:${e.c}"></span>
              <span class="lname">${e.ico} ${e.n}</span>
              <span class="lval">${Math.round(e.v/totalExp*100)}%</span>
            </div>`).join('')}
        </div>
      </div>
    </div>

    <div class="card">
      <h3>🎯 Семейные цели <span class="tag">Все вместе</span></h3>
      ${state.goals.map((g, i) => {
        const pct = Math.min(100, Math.round(g.current / g.target * 100));
        return `
        <div class="goal">
          <div class="goal-row">
            <span class="gname">${g.name}</span>
            <span class="gval">${g.current.toLocaleString('ru-RU')} / ${g.target.toLocaleString('ru-RU')} ₽</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <div class="progress" style="flex:1"><div data-w="${pct}"></div></div>
            ${sparkline(g.history, 42, 18, pct > 50)}
          </div>
        </div>`;
      }).join('')}
      <button class="btn btn-gold" style="margin-top:12px" onclick="openGoalModal()">＋ Пополнить цель</button>
    </div>

    <div class="card">
      <h3>💳 Карманные <span class="tag">По правилам</span></h3>
      ${state.pockets.map((p, i) => {
        const left = p.limit - p.spent;
        const pct = Math.round(left / p.limit * 100);
        const low = left < p.limit * 0.3;
        return `
        <div class="pocket">
          ${miniRing(pct, 32)}
          <div class="pocket-info">
            <b>${p.name}</b>
            <div class="muted-line" style="margin-top:2px">${p.spent.toLocaleString('ru-RU')} из ${p.limit.toLocaleString('ru-RU')} ₽</div>
          </div>
          <span class="amount ${low ? 'low' : ''}">${left.toLocaleString('ru-RU')} ₽</span>
        </div>`;
      }).join('')}
      ${r_canManage()
        ? `<button class="btn btn-primary" style="margin-top:12px" onclick="openPocketModal()">Задать лимит</button>`
        : `<p class="muted-line">Управление лимитами доступно взрослым</p>`}
    </div>

    <div class="card">
      <h3>⚡ Быстрые действия</h3>
      <div class="quick-actions">
        <div class="qa" onclick="openTransferModal()"><div class="qa-ico">↗</div>Перевод</div>
        <div class="qa" onclick="openGoalModal()"><div class="qa-ico">🎯</div>Цель</div>
        <div class="qa" onclick="openPocketModal()"><div class="qa-ico">💳</div>Лимит</div>
        <div class="qa" onclick="showToast('Оплата по QR-коду 📷')"><div class="qa-ico">📷</div>QR-оплата</div>
      </div>
    </div>
    `;
  },

  budget: () => {
    const maxM = Math.max(...state.monthly.map(m => m.v));
    return `
    <div class="card">
      <h3>🏦 Общий бюджет</h3>
      <div class="stat-big">${state.familyBudget.toLocaleString('ru-RU')} ₽</div>
      <p class="muted-line" style="margin-bottom:14px">Автоматическое распределение по категориям</p>
      ${state.expenses.map(e => `
        <div class="goal">
          <div class="goal-row"><span class="gname">${e.ico} ${e.n}</span><span class="gval">${e.v.toLocaleString('ru-RU')} ₽</span></div>
          <div class="progress green"><div data-w="${Math.round(e.v/state.familyBudget*100)}"></div></div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>📅 Расходы по месяцам <span class="tag">6 мес</span></h3>
      <div class="bars">
        ${state.monthly.map(m => `
          <div class="bar-col">
            <div class="bar-track">
              <div class="bar ${m.c}" data-h="${Math.round(m.v/maxM*100)}">
                <span class="bar-tip">${m.v.toLocaleString('ru-RU')} ₽</span>
              </div>
            </div>
            <span class="bar-label">${m.m}</span>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>📈 Динамика накоплений <span class="tag">+18%</span></h3>
      <svg class="line-chart" viewBox="0 0 300 110" preserveAspectRatio="none">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1f9d63" stop-opacity=".28"/>
            <stop offset="100%" stop-color="#1f9d63" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path class="line-area" d="M0 90 L50 78 L100 62 L150 50 L200 38 L250 26 L300 14 L300 110 L0 110 Z"/>
        <path class="line-path" d="M0 90 L50 78 L100 62 L150 50 L200 38 L250 26 L300 14"/>
        ${[[0,90],[50,78],[100,62],[150,50],[200,38],[250,26],[300,14]].map(([x,y],i)=>
          `<circle class="line-dot" cx="${x}" cy="${y}" r="3.5" onclick="showToast('Месяц ${i+1}: ${(50+i*12).toLocaleString('ru-RU')} ₽')"/>`
        ).join('')}
      </svg>
      <div class="flex-between" style="margin-top:6px;font-size:9.5px;color:var(--muted);font-weight:600">
        <span>Янв</span><span>Фев</span><span>Мар</span><span>Апр</span><span>Май</span><span>Июн</span><span>Июл</span>
      </div>
    </div>

    <div class="card">
      <h3>🕸️ Финансовые навыки семьи</h3>
      <svg class="radar" viewBox="0 0 200 190">
        ${[1,2,3].map(level => {
          const r = level * 26;
          const pts = Array.from({length: 6}, (_, i) => {
            const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
            return `${100 + r * Math.cos(a)},${85 + r * Math.sin(a)}`;
          }).join(' ');
          return `<polygon points="${pts}" fill="none" stroke="#e2e8e6" stroke-width="1"/>`;
        }).join('')}
        ${Array.from({length: 6}, (_, i) => {
          const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
          return `<line class="radar-axis" x1="100" y1="85" x2="${100 + 78*Math.cos(a)}" y2="${85 + 78*Math.sin(a)}"/>`;
        }).join('')}
        ${(() => {
          const pts = state.skills.map((s, i) => {
            const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
            const r = s.a / 100 * 78;
            return `${100 + r*Math.cos(a)},${85 + r*Math.sin(a)}`;
          }).join(' ');
          return `<polygon class="radar-poly" points="${pts}"/>`;
        })()}
        ${(() => {
          const pts = state.skills.map((s, i) => {
            const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
            const r = s.b / 100 * 78;
            return `${100 + r*Math.cos(a)},${85 + r*Math.sin(a)}`;
          }).join(' ');
          return `<polygon class="radar-poly alt" points="${pts}"/>`;
        })()}
        ${state.skills.map((s, i) => {
          const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
          const x = 100 + 88 * Math.cos(a);
          const y = 85 + 88 * Math.sin(a);
          return `<text class="radar-label" x="${x}" y="${y+3}" text-anchor="middle">${s.n}</text>`;
        }).join('')}
      </svg>
      <div style="display:flex;gap:14px;justify-content:center;margin-top:4px;font-size:10px;font-weight:600">
        <span style="color:var(--gold-deep)">● Сейчас</span>
        <span style="color:var(--green)">● Цель</span>
      </div>
    </div>

    <div class="card">
      <h3>👥 Роли семьи</h3>
      ${Object.entries(state.roles).map(([k, r]) => `
        <div class="pocket" style="cursor:pointer" onclick="switchRole('${k}'); document.getElementById('roleSelect').value='${k}'">
          <div class="pocket-info"><b>${r.name}</b><div class="muted-line" style="margin-top:2px">${r.title}</div></div>
          <span class="amount">${r.balance.toLocaleString('ru-RU')} ₽</span>
        </div>`).join('')}
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="openTransferModal()">↗ Перевод</button>
      <button class="btn btn-gold" onclick="showToast('История операций загружается…')">📜 История</button>
    </div>
    `;
  },

  security: () => `
    <div class="card">
      <h3>🛡️ Защита семьи <span class="tag">ИИ-детектор</span></h3>
      ${state.securityEvents.map(e => `
        <div class="safe-item">
          <div class="safe-icon ${e.type}">${e.icon}</div>
          <div><b>${e.title}</b><p>${e.desc}</p></div>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>🔐 Настройки безопасности</h3>
      ${[
        { t: 'Доверенные контакты', d: 'Крупные переводы подтверждает семья', on: true },
        { t: 'Лимиты по возрасту', d: 'Для детей и пожилых — автоматически', on: true },
        { t: 'Антифрод-мониторинг 24/7', d: 'Проверка каждой операции', on: true },
        { t: 'Упрощённый режим', d: 'Крупный шрифт и голосовые подсказки', on: state.currentRole === 'senior' }
      ].map(x => `
        <div class="pocket">
          <div class="pocket-info"><b>${x.t}</b><div class="muted-line" style="margin-top:2px">${x.d}</div></div>
          <span style="color:${x.on ? 'var(--green)' : 'var(--muted)'};font-size:18px">${x.on ? '●' : '○'}</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>🔥 Активность за 7 недель</h3>
      <div class="heatmap">
        ${state.heatmap.map((l, i) => `
          <div class="heat-cell" data-l="${l}" title="День ${i+1}: ${l} операций"
            onclick="showToast('День ${i+1}: ${l} операций')"></div>`).join('')}
      </div>
      <div class="heat-legend">
        <span>Меньше</span>
        <div class="heat-cell" data-l="0"></div>
        <div class="heat-cell" data-l="1"></div>
        <div class="heat-cell" data-l="2"></div>
        <div class="heat-cell" data-l="3"></div>
        <div class="heat-cell" data-l="4"></div>
        <div class="heat-cell" data-l="5"></div>
        <span>Больше</span>
      </div>
    </div>

    <button class="btn btn-primary" onclick="showToast('Тест на мошенничество запущен 🔍'); mascotReaction('happy')">Пройти проверку безопасности</button>
  `,

  game: () => {
    const pct = Math.min(100, state.xp / state.xpMax * 100);
    const r = 30;
    const c = 2 * Math.PI * r;
    const off = c - (pct / 100) * c;
    return `
    <div class="card">
      <h3>🎮 Обучение через игру</h3>
      <div class="xp-ring-wrap">
        <svg class="xp-ring" viewBox="0 0 78 78">
          <defs>
            <linearGradient id="xpGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e8d5a3"/>
              <stop offset="100%" stop-color="#a8873f"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="39" cy="39" r="${r}"/>
          <circle class="val" cx="39" cy="39" r="${r}"
            stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${off}"
            transform="rotate(-90 39 39)"/>
          <text x="39" y="42" text-anchor="middle" font-size="16" font-weight="800" fill="#0a2e29">${state.xp}</text>
          <text x="39" y="54" text-anchor="middle" font-size="8" font-weight="600" fill="#6d817c">XP</text>
        </svg>
        <div>
          <div class="muted-line">Ваш уровень</div>
          <div style="font-size:18px;font-weight:800;color:var(--dark);letter-spacing:-.3px">Финансовый новичок</div>
          <div class="muted-line" style="margin-top:2px">До следующего: ${state.xpMax - state.xp} XP</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>🗺️ Активные квесты</h3>
      ${state.quests.map((q, i) => `
        <div class="quest ${q.done ? 'done' : ''}">
          <span>${q.done ? '✅' : '⏳'} ${q.text}</span>
          <span class="xp">+${q.xp} XP</span>
        </div>`).join('')}
    </div>

    <div class="card">
      <h3>🏆 Семейный рейтинг</h3>
      ${[
        { n: 'Миша', xp: 540 }, { n: 'Соня', xp: 320 },
        { n: 'Бабушка', xp: 280 }, { n: 'Папа', xp: 240 }
      ].sort((a, b) => b.xp - a.xp).map((u, i) => {
        const maxXp = 540;
        return `
        <div class="rating-row">
          <span style="width:70px">${['🥇','🥈','🥉','4.'][i]} ${u.n}</span>
          <div class="rating-bar"><div style="width:${Math.round(u.xp/maxXp*100)}%"></div></div>
          <span class="amount" style="width:50px;text-align:right">${u.xp} XP</span>
        </div>`;
      }).join('')}
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="startQuest()">🎲 Начать квест</button>
      <button class="btn btn-gold" onclick="showToast('Симулятор жизни загружается 🚀')">🚀 Симулятор</button>
    </div>
    `;
  }
};

/* ==================== ИНТЕРАКТИВ ДИАГРАММ ==================== */
function highlightDonut(idx) {
  document.querySelectorAll('.donut-seg').forEach((s, i) => {
    s.classList.toggle('dim', i !== idx);
  });
  document.querySelectorAll('.legend-item').forEach((l, i) => {
    l.classList.toggle('dim', i !== idx);
  });
}
function resetDonut() {
  document.querySelectorAll('.donut-seg').forEach(s => s.classList.remove('dim'));
  document.querySelectorAll('.legend-item').forEach(l => l.classList.remove('dim'));
}

/* ==================== ДЕЙСТВИЯ ==================== */
function switchTab(tab, btn) {
  state.currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function switchRole(role) {
  state.currentRole = role;
  render();
  showToast(`Вы вошли как ${state.roles[role].name} · ${state.roles[role].title}`);
  mascotReaction('happy');
}

function startQuest() {
  const q = state.quests.find(q => !q.done);
  if (!q) { showToast('Все квесты выполнены! 🎉'); return; }
  q.done = true;
  state.xp = Math.min(state.xpMax, state.xp + q.xp);
  render();
  showToast(`Квест выполнен! +${q.xp} XP 🎉`);
  mascotReaction('happy');
}

/* ==================== МОДАЛКИ ==================== */
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function openGoalModal() {
  openModal(`
    <h2>Пополнить семейную цель</h2>
    <label>Цель</label>
    <select id="goalSelect">
      ${state.goals.map((g, i) => `<option value="${i}">${g.name}</option>`).join('')}
    </select>
    <label>Сумма (₽)</label>
    <input type="number" id="goalAmount" placeholder="1000" min="1" inputmode="numeric">
    <button class="btn btn-gold" onclick="addToGoal()">Пополнить</button>
    <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
  `);
}

function addToGoal() {
  const idx = +document.getElementById('goalSelect').value;
  const amount = +document.getElementById('goalAmount').value;
  if (!amount || amount <= 0) { showToast('Введите корректную сумму'); mascotReaction('sad'); return; }
  if (amount > state.roles[state.currentRole].balance) { showToast('Недостаточно средств 😔'); mascotReaction('sad'); return; }
  state.roles[state.currentRole].balance -= amount;
  state.goals[idx].current += amount;
  state.goals[idx].history.push(state.goals[idx].current);
  if (state.currentRole === 'parent') state.familyBudget -= amount;
  closeModal(); render();
  showToast(`+${amount.toLocaleString('ru-RU')} ₽ в копилку «${state.goals[idx].name}» ✨`);
  mascotReaction('happy');
}

function openPocketModal() {
  openModal(`
    <h2>Задать лимит карманных</h2>
    <label>Член семьи</label>
    <select id="pocketSelect">
      ${state.pockets.map((p, i) => `<option value="${i}">${p.name}</option>`).join('')}
    </select>
    <label>Лимит в месяц (₽)</label>
    <input type="number" id="pocketLimit" placeholder="5000" min="100" inputmode="numeric">
    <button class="btn btn-primary" onclick="setPocketLimit()">Сохранить</button>
    <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
  `);
}

function setPocketLimit() {
  const idx = +document.getElementById('pocketSelect').value;
  const limit = +document.getElementById('pocketLimit').value;
  if (!limit || limit < 100) { showToast('Минимальный лимит — 100 ₽'); mascotReaction('sad'); return; }
  state.pockets[idx].limit = limit;
  closeModal(); render();
  showToast(`Лимит для ${state.pockets[idx].name} обновлён: ${limit.toLocaleString('ru-RU')} ₽`);
  mascotReaction('happy');
}

function openTransferModal() {
  openModal(`
    <h2>Семейный перевод</h2>
    <label>Кому</label>
    <select id="toUser">
      ${Object.entries(state.roles)
        .filter(([k]) => k !== state.currentRole)
        .map(([k, r]) => `<option value="${k}">${r.name} — ${r.title}</option>`).join('')}
    </select>
    <label>Сумма (₽)</label>
    <input type="number" id="transferAmount" placeholder="500" min="1" inputmode="numeric">
    <button class="btn btn-primary" onclick="doTransfer()">Перевести</button>
    <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
  `);
}

function doTransfer() {
  const to = document.getElementById('toUser').value;
  const amount = +document.getElementById('transferAmount').value;
  const from = state.currentRole;
  if (!amount || amount <= 0) { showToast('Введите корректную сумму'); mascotReaction('sad'); return; }
  if (amount > state.roles[from].balance) { showToast('Недостаточно средств 😔'); mascotReaction('sad'); return; }
  state.roles[from].balance -= amount;
  state.roles[to].balance += amount;
  closeModal(); render();
  showToast(`Перевод ${amount.toLocaleString('ru-RU')} ₽ → ${state.roles[to].name} отправлен 💸`);
  mascotReaction('happy');
}

/* ==================== TOAST ==================== */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ==================== СТАРТ ==================== */
render();
</script>
</body>
</html>
